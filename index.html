<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contas · teste de conexão</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Teste de conexão com a planilha</h1>
  <p>Configure a URL do Apps Script e a chave, depois teste a conexão.</p>

  <fieldset>
    <legend>Configuração</legend>
    <label for="url">URL do app da Web</label>
    <input id="url" type="url" placeholder="Cole a URL que termina em /exec">
    <label for="key">Chave</label>
    <input id="key" type="password" autocomplete="off">
    <div class="row">
      <button id="save">Salvar configuração</button>
      <button id="clear" class="ghost">Apagar configuração</button>
    </div>
  </fieldset>

  <div class="row">
    <button id="ping">Testar conexão</button>
    <button id="read" class="ghost">Ler planilha</button>
    <button id="append" class="ghost">Gravar linha de teste</button>
  </div>

  <h2>Resultado</h2>
  <pre id="out">Nenhuma chamada feita ainda.</pre>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
